<title>벽람항로 장비 배치기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a dockyard work sheet. Header + three views (배치 결과 / 함대 / 창고); each ship is one row of five slot cells. */
:root {
  --bg: #eceff2; --panel: #ffffff; --panel2: #f5f7f9; --ink: #18212b; --muted: #5a6674; --line: #d3d9df;
  --accent: #b5601c; --accent-ink: #ffffff; --sea: #1d6b74;
  --r1: #2e7a4c; --r2: #1d6b74; --r3: #8b6a10; --rx: #a63c3c;
  --n: #8d949c; --rare: #3c7ccc; --elite: #8656d1; --ssr: #c08e12;
  --display: "Do Hyeon", "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1317; --panel: #161d23; --panel2: #1b242b; --ink: #e2e7eb; --muted: #94a1ad; --line: #28333c;
  --accent: #e08b42; --accent-ink: #1a1007; --sea: #55b4bd;
  --r1: #5cbf83; --r2: #55b4bd; --r3: #d8b24a; --rx: #e07a7a;
  --n: #9aa1a8; --rare: #6aa5f0; --elite: #ad89f0; --ssr: #e2b33a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e1317; --panel: #161d23; --panel2: #1b242b; --ink: #e2e7eb; --muted: #94a1ad; --line: #28333c;
  --accent: #e08b42; --accent-ink: #1a1007; --sea: #55b4bd;
  --r1: #5cbf83; --r2: #55b4bd; --r3: #d8b24a; --rx: #e07a7a;
  --n: #9aa1a8; --rare: #6aa5f0; --elite: #ad89f0; --ssr: #e2b33a; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 14px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px }
.wrap { max-width: 1180px; margin: 0 auto }
header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; padding-block: 22px 14px; border-bottom: 2px solid var(--ink) }
h1 { font-family: var(--display); font-weight: 400; font-size: 34px; line-height: 1.05; margin: 0; letter-spacing: .01em; text-wrap: balance }
.sub { color: var(--muted); font-size: 13px; margin-top: 6px }
.save { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block }
.dot.ok { background: var(--r1) } .dot.warn { background: var(--r3) } .dot.err { background: var(--rx) }
nav.tabs { display: flex; gap: 4px; margin-block: 14px 18px; flex-wrap: wrap }
nav.tabs button { font: 500 14px var(--body); padding: 8px 16px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px; cursor: pointer }
nav.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink) }
button, select, input { font: inherit; color: inherit }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.btn { padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; font-size: 13px }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700 }
.btn:disabled { opacity: .5; cursor: default }
.btn.icon { padding: 4px 9px; min-width: 32px }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap }
.grow { flex: 1 1 auto; min-width: 0 }
.muted { color: var(--muted) }
.small { font-size: 12px }
h2 { font-family: var(--display); font-weight: 400; font-size: 24px; margin: 0; text-wrap: balance }
h3 { font-size: 15px; margin: 0 }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px }
.stack { display: grid; gap: 14px }

/* summary strip */
.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin-bottom: 18px }
.summary h3 { margin-bottom: 8px }
.want { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none }
.want li { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px dashed var(--line); padding-block: 3px }
.want li:last-child { border-bottom: 0 }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); margin-bottom: 12px }

/* fleets & ships */
.fleet { margin-bottom: 22px }
.fleet-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 8px }
.fleet-head .tag { font-size: 12px; color: var(--sea); border: 1px solid var(--sea); border-radius: 999px; padding: 1px 8px }
.ship { display: grid; grid-template-columns: 190px 1fr; gap: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 8px }
.ship-name { font-weight: 700; font-size: 16px; line-height: 1.25 }
.ship-meta { font-size: 12px; color: var(--muted); margin-top: 2px }
.rates { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px }
.rate { font: 500 11px var(--mono); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; color: var(--muted) }
.rate b { color: var(--ink) }
.warnline { font-size: 12px; color: var(--rx); margin-top: 6px }
.slots { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; min-width: 0 }
.slot { position: relative; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px 7px 11px; min-width: 0; overflow: hidden }
.slot::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--n) }
.slot.ra3::before { background: var(--rare) } .slot.ra4::before { background: var(--elite) } .slot.ra5::before { background: var(--ssr) }
.slot.ra6::before { background: linear-gradient(180deg, #e8577a, #e8b13c, #4fc28a, #4f8fe8, #a35be8) }
.slot-type { font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; gap: 4px }
.slot-name { font-weight: 500; font-size: 13px; line-height: 1.3; overflow-wrap: anywhere }
.slot.empty .slot-name { color: var(--muted); font-weight: 400 }
.rk { font: 500 10.5px var(--mono); border-radius: 4px; padding: 0 4px; white-space: nowrap }
.rk.r1 { color: var(--r1); border: 1px solid var(--r1) } .rk.r2 { color: var(--r2); border: 1px solid var(--r2) }
.rk.r3 { color: var(--r3); border: 1px solid var(--r3) } .rk.rx { color: var(--rx); border: 1px solid var(--rx) }
.note { font-size: 11px; color: var(--muted); margin-top: 3px }
.shared { font-size: 13px; color: var(--muted); padding: 10px 12px; border: 1px dashed var(--line); border-radius: 10px; margin-bottom: 8px }

/* fleet editor */
.edit-fleet { display: grid; gap: 10px }
.edit-fleet .ctrls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.edit-fleet input.name { font-weight: 700; font-size: 15px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel2); min-width: 0; flex: 1 1 180px }
select { padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel2) }
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.chip { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); background: var(--panel2); border-radius: 999px; padding: 3px 4px 3px 10px; font-size: 13px }
.chip button { border: 0; background: transparent; cursor: pointer; color: var(--muted); padding: 0 5px; border-radius: 999px; font-size: 13px }
.chip button:hover { color: var(--ink); background: var(--line) }
.search { position: relative; flex: 1 1 220px; min-width: 0 }
.search input { width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel2) }
.drop { position: absolute; z-index: 5; left: 0; right: 0; top: calc(100% + 4px); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.15); max-height: 300px; overflow: auto }
.drop button { display: flex; justify-content: space-between; gap: 8px; width: 100%; text-align: left; padding: 7px 10px; border: 0; background: transparent; cursor: pointer }
.drop button:hover, .drop button:focus { background: var(--panel2) }

/* inventory */
.inv-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px }
.inv-tools input[type=search] { flex: 1 1 220px; min-width: 0; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel) }
.inv { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 6px }
.item { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; min-width: 0 }
.item .bar { width: 4px; align-self: stretch; border-radius: 2px; background: var(--n); flex: none }
.item.ra3 .bar { background: var(--rare) } .item.ra4 .bar { background: var(--elite) } .item.ra5 .bar { background: var(--ssr) }
.item.ra6 .bar { background: linear-gradient(180deg, #e8577a, #e8b13c, #4fc28a, #4f8fe8, #a35be8) }
.item .nm { flex: 1 1 auto; min-width: 0; font-size: 13px; line-height: 1.3 }
.item .nm small { display: block; color: var(--muted); font-size: 11px }
.item input { width: 52px; text-align: center; padding: 3px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel2) }
.item.zero { opacity: .62 }
.capture { margin-bottom: 14px }
.capture table { width: 100%; border-collapse: collapse; font-size: 13px }
.capture th, .capture td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: top }
.tablewrap { overflow-x: auto }
.status { font-size: 13px; color: var(--muted); white-space: pre-wrap }
.ico { display: inline-block; flex: none; background-repeat: no-repeat; border-radius: 6px }
.ico.ph { background: var(--line) }
.eqbox { display: inline-flex; flex: none; border-radius: 8px; padding: 2px; background: color-mix(in srgb, var(--n) 22%, transparent) }
.eqbox.ra3 { background: color-mix(in srgb, var(--rare) 24%, transparent) } .eqbox.ra4 { background: color-mix(in srgb, var(--elite) 24%, transparent) }
.eqbox.ra5 { background: color-mix(in srgb, var(--ssr) 26%, transparent) } .eqbox.ra6 { background: linear-gradient(135deg, rgba(232,87,122,.28), rgba(232,177,60,.28), rgba(79,194,138,.28), rgba(79,143,232,.28), rgba(163,91,232,.28)) }
.slot-body { display: flex; gap: 8px; align-items: flex-start; margin-top: 3px; min-width: 0 }
.slot-body > div { min-width: 0 }
.ship-head { display: flex; gap: 10px; align-items: flex-start }
.ship-head .ico { border-radius: 10px; border: 1px solid var(--line) }
.want li > span:first-child { display: inline-flex; align-items: center; gap: 6px; min-width: 0 }
.chip .ico { margin-left: -6px; border-radius: 999px }
.drop button > span:first-child { display: inline-flex; align-items: center; gap: 8px }
.empty-state { text-align: center; padding: 40px 16px; color: var(--muted) }

@media (max-width: 860px) {
  .ship { grid-template-columns: 1fr }
  .slots { grid-template-columns: repeat(2, minmax(0, 1fr)) }
}
@media (max-width: 420px) { h1 { font-size: 28px } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>벽람항로 장비 배치기</h1>
      <div class="sub">REGAL 엔드게임 티어 목록의 칸별 우선순위대로 창고 장비를 함대에 나눠 줘요 · 데이터 <span id="dataDate"></span></div>
    </div>
    <div class="save" id="saveState"><span class="dot"></span><span>불러오는 중</span></div>
  </header>
  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-result" aria-selected="true" data-view="result">배치 결과</button>
    <button role="tab" id="tab-fleets" aria-selected="false" data-view="fleets">함대 편성</button>
    <button role="tab" id="tab-inv" aria-selected="false" data-view="inv">창고</button>
  </nav>
  <main>
    <section id="view-result"></section>
    <section id="view-fleets" hidden></section>
    <section id="view-inv" hidden></section>
  </main>
</div>

<script id="data" type="application/json">__DATA__</script>
<script>
(() => {
const D = JSON.parse(document.getElementById('data').textContent);
document.getElementById('dataDate').textContent = D.date;
const E = D.E;               // id -> [name, rarity, type, nation]
const SHIPS = {};            // uid -> ship
for (const s of D.S) SHIPS[s[0]] = { uid: s[0], kr: s[1], en: s[2], hull: s[3], fac: s[4], rar: s[5], rt: s[6], st: s[7], tabs: s[8], lo: s[9], hl: s[10] };
const SHIP_LIST = Object.values(SHIPS);
const SHIP_IDX = {}; D.S.forEach((s, i) => { SHIP_IDX[s[0]] = i; });
function sprite(kind, idx, size) {
  if (idx == null) return '<span class="ico ph" style="width:' + size + 'px;height:' + size + 'px" aria-hidden="true"></span>';
  const a = D.ATLAS[kind], c = idx % a.cols, r = Math.floor(idx / a.cols);
  return '<span class="ico" aria-hidden="true" style="width:' + size + 'px;height:' + size + 'px;background-image:url(' + a.file + ');background-size:' + (a.cols * size) + 'px auto;background-position:-' + (c * size) + 'px -' + (r * size) + 'px"></span>';
}
const eico = (id, size) => '<span class="eqbox ra' + (E[id] ? E[id][1] : 0) + '">' + sprite('eq', D.EI[id], size) + '</span>';
const sico = (uid, size) => sprite('ship', SHIP_IDX[uid], size);
const TYPE = {1:'구축포',2:'경순포',3:'중순포',4:'전함포',5:'어뢰',6:'대공',7:'전투기',8:'뇌격기',9:'폭격기',10:'설비',11:'대순포',12:'수상기',13:'잠수함 어뢰',14:'설비',15:'초계기',17:'헬기',18:'적재',20:'미사일',21:'대공(시한신관)'};
const HULL = {DD:'구축',CL:'경순',CA:'중순',CB:'대순',BB:'전함',BC:'순전',BBV:'항전',CV:'항모',CVL:'경항모',SS:'잠수',SSV:'잠모',AR:'공작',AE:'운송',IX:'범선',IXs:'범선',IXv:'범선',IXm:'범선'};
const NATCODE = {1:'USS',2:'HMS',3:'IJN',4:'KMS',5:'ROC',6:'RN',7:'SN',8:'FFNF',9:'MNF'};
const NATKR = {USS:'유니온',HMS:'로열',IJN:'사쿠라',KMS:'철혈',ROC:'동煌',RN:'사르데냐',SN:'북방연합',FFNF:'아이리스',MNF:'비시아',DEV:'공용',UNIV:'공용'};
const NOTE_KR = {'같은 종류 대체':'다른 로드아웃의 같은 종류 장비로 대체','any gold AA > purple':'금색 대공포면 됨 (보라보다 우선)','Any 35 FP':'화력 35 이상이면 됨','Any 45 FP':'화력 45 이상이면 됨','any 500+ HP':'내구 500 이상이면 됨','Any fighter with 2 x 500lb':'500lb 폭탄 2발 전투기면 됨','Purple fighter with 2 x 500lb':'500lb 폭탄 2발 보라 전투기','if have spares':'남을 때만','if have spare (unlikely)':'남을 때만','on her or another DD':'이 함선이나 다른 구축함에 1개','Don\'t know which is best.':'REGAL도 우열 미정','sort by FP':'화력 높은 순','any spare gun':'남는 포 아무거나','lower rarity ok':'낮은 등급도 됨','or gold version':'금색 버전도 됨','any Sardegna gear':'사르데냐 장비면 됨'};
const ALT = {2640:[2620,2600], 800:[151160]};
const SAME_NAME = {}; for (const k of Object.keys(E)) { const n = E[k][0]; (SAME_NAME[n] = SAME_NAME[n] || []).push(+k); }
const WILD_GUN = new Set([11240, 31040]);
const WILD_RN = new Set([95160]);
const RATE_LABEL = ['14지 쫄','14지 보스','15·16지 쫄','15·16지 보스','META'];
const MODES = {camp:'메인해역·다중 웨이브', L:'보스 · 경장갑', M:'보스 · 중형장갑', H:'보스 · 중장갑'};

const ename = id => (E[id] ? E[id][0] : '장비 #' + id);
const erar = id => (E[id] ? E[id][1] : 0);
const etype = id => (E[id] ? E[id][2] : 0);
const enat = id => (E[id] ? E[id][3] : '');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---------- state ----------
let state = { counts: {}, fleets: [] };
let loaded = { inv: false, fleets: false };
let dbRef = null, saveTimers = {}, saving = {};
function setSave(cls, text) { const el = document.getElementById('saveState'); el.innerHTML = '<span class="dot ' + cls + '"></span><span>' + esc(text) + '</span>'; }

// ---------- REGAL rows ----------
function tabFor(ship, mode, aa) {
  if (ship.lo) { const keys = Object.keys(ship.lo); return keys.includes('C') ? 'C' : keys[0]; }
  const t = ship.tabs || {}; const keys = Object.keys(t);
  if (!keys.length) return null;
  if (mode === 'camp') {
    const order = (ship.hull === 'CV' || ship.hull === 'CVL') ? [aa === 'few' ? 'C-noAA' : 'C-AA', 'C-AA', 'C-noAA', 'C-13+', 'C'] : ['C-13+', 'C', 'C-AA', 'C-noAA'];
    for (const k of order) if (t[k] != null) return k;
    return keys[0];
  }
  return keys.find(k => k.split('/').includes(mode)) || keys.find(k => k.startsWith('C')) || keys[0];
}
function slotRows(ship, tab) {
  const uc = D.U[String(ship.tabs[tab])]; if (!uc) return null;
  return uc.map(sl => (D.SL[String(sl)] || []).map(rw => (D.RW[String(rw)] || []).map(k => D.EK[String(k)]).filter(x => typeof x === 'number')));
}
function loadoutRanks(ship, tab) {
  return (ship.lo[tab] || []).map(rw => (D.RW[String(rw)] || []).map(k => D.EK[String(k)]).filter(Array.isArray).map(a => a.slice(0, 5)));
}
function slotTypes(ship, i) { return ship.st && ship.st[i] ? ship.st[i] : []; }
function hlRules(ship) { return (ship.hl || []).map(r => ({ nats: r.nations.map(n => NATCODE[n]).filter(Boolean), slots: r.slots.map(x => x - 1), value: r.value, prefix: r.prefix || '' })); }

// ---------- allocation ----------
function expand(id, ship, i, left, wild) {
  const out = [id];
  if (ALT[id]) out.push(...ALT[id]);
  if (ship.lo && E[id]) for (const x of SAME_NAME[E[id][0]]) if (x !== id && erar(x) < erar(id)) out.push(x);
  if (wild && (WILD_GUN.has(id) || WILD_RN.has(id))) {
    const types = slotTypes(ship, i);
    const pool = Object.keys(left).map(Number).filter(x => left[x] > 0 && types.includes(etype(x)) && (!WILD_RN.has(id) || enat(x) === 'RN'));
    pool.sort((a, b) => erar(b) - erar(a)); out.push(...pool);
  }
  return out;
}
function natScore(rules, i, id) { let s = 0; for (const r of rules) if (r.slots.includes(i) && r.nats.includes(enat(id))) s += r.value; return s; }
function pick(cands, left, rules, i) {
  const ok = cands.filter(id => (left[id] || 0) > 0);
  if (!ok.length) return null;
  ok.sort((a, b) => natScore(rules, i, b) - natScore(rules, i, a) || erar(b) - erar(a) || (left[b] || 0) - (left[a] || 0));
  return ok[0];
}
function allocate() {
  const left = {}; for (const [k, v] of Object.entries(state.counts)) if (v > 0) left[+k] = v;
  const done = {}; const out = [];
  const wanted = {};   // id -> number of slots where it is rank 1 but missing
  for (const fl of state.fleets) {
    const res = { fleet: fl, ships: [] };
    const members = [];
    for (const uid of fl.ships) {
      const ship = SHIPS[uid]; if (!ship) continue;
      if (done[uid]) { res.ships.push({ ship, sharedWith: done[uid] }); continue; }
      const tab = tabFor(ship, fl.mode, fl.aa);
      const m = { ship, tab, slots: [null, null, null, null, null], rules: hlRules(ship), warn: [] };
      done[uid] = fl.name; members.push(m); res.ships.push(m);
    }
    // submarines: whole loadouts
    for (const m of members) if (m.ship.lo) {
      const ranks = loadoutRanks(m.ship, m.tab);
      let best = null;
      ranks.forEach((opts, r) => opts.forEach(lo => {
        const trial = { ...left }; let got = 0;
        lo.forEach((id, i) => { const p = pick(expand(id, m.ship, i, trial), trial, [], i); if (p != null) { trial[p]--; got++; } });
        if (!best || got > best.got) best = { got, r, lo };
      }));
      if (!best) continue;
      best.lo.forEach((id, i) => { const p = pick(expand(id, m.ship, i, left), left, [], i); if (p != null) { left[p]--; m.slots[i] = { id: p, rank: best.r + 1, note: D.NOTE[id] }; } });
      // empty slots: take what another loadout puts in the same slot
      for (let i = 0; i < 5; i++) if (!m.slots[i]) {
        for (let r = 0; r < ranks.length && !m.slots[i]; r++) for (const lo of ranks[r]) {
          const p = pick(expand(lo[i], m.ship, i, left), left, [], i); if (p != null) { left[p]--; m.slots[i] = { id: p, rank: r + 1, note: D.NOTE[lo[i]] }; break; }
        }
      }
      if (ranks[0]) for (const lo of ranks[0].slice(0, 1)) lo.forEach((id, i) => { const s = m.slots[i]; if ((!s || s.rank > 1) && !(state.counts[id] > 0) && !(ALT[id] || []).some(a => state.counts[a] > 0)) tally(wanted, id); });
      m.subDone = true;
    }
    // surface ships: rank by rank across the fleet
    const reg = members.filter(m => !m.ship.lo && m.tab);
    reg.forEach(m => m.rows = slotRows(m.ship, m.tab));
    // strong single-slot nation rules first
    for (const m of reg) for (const r of m.rules) if (r.value >= 2 && r.slots.length <= 2) for (const i of r.slots) {
      if (m.slots[i] || !m.rows || !m.rows[i]) continue;
      for (let k = 0; k < m.rows[i].length && !m.slots[i]; k++) {
        const c = m.rows[i][k].flatMap(id => expand(id, m.ship, i, left)).filter(id => r.nats.includes(enat(id)));
        const p = pick(c, left, m.rules, i); if (p != null) { left[p]--; m.slots[i] = { id: p, rank: k + 1 }; }
      }
    }
    const maxR = Math.max(0, ...reg.map(m => Math.max(0, ...(m.rows || []).map(s => s.length))));
    for (let k = 0; k < maxR; k++) for (const m of reg) for (let i = 0; i < 5; i++) {
      if (m.slots[i] || !m.rows || !m.rows[i] || !m.rows[i][k]) continue;
      const src = {};
      const c = m.rows[i][k].flatMap(id => { const ex = expand(id, m.ship, i, left); for (const x of ex) if (!(x in src)) src[x] = id; return ex; });
      const p = pick(c, left, m.rules, i);
      if (p != null) { left[p]--; m.slots[i] = { id: p, rank: k + 1, note: D.NOTE[src[p]] }; }
    }
    // tally missing first-row items
    for (const m of reg) for (let i = 0; i < 5; i++) {
      const s = m.slots[i]; if (s && s.rank === 1) continue;
      const first = m.rows && m.rows[i] && m.rows[i][0]; if (!first) continue;
      for (const id of first) if (!(state.counts[id] > 0) && !(ALT[id] || []).some(a => state.counts[a] > 0)) tally(wanted, id);
    }
    res.members = members;
    out.push(res);
  }
  const all = out.flatMap(r => r.members);
  // pass 2: rows that accept "any spare" gear, and submarine slots that other loadouts fill with the same kind of item
  for (const m of all) for (let i = 0; i < 5; i++) {
    if (m.slots[i]) continue;
    if (m.ship.lo) {
      const types = slotTypes(m.ship, i);
      const ids = [...new Set(loadoutRanks(m.ship, m.tab).flat().flat())].filter(id => types.includes(etype(id)));
      const p = pick(ids.flatMap(id => expand(id, m.ship, i, left)), left, [], i); if (p != null) { left[p]--; m.slots[i] = { id: p, rank: 0, note: '같은 종류 대체' }; }
      continue;
    }
    if (!m.rows || !m.rows[i]) continue;
    for (let k = 0; k < m.rows[i].length && !m.slots[i]; k++) {
      const src = {};
      const c = m.rows[i][k].flatMap(id => { const ex = expand(id, m.ship, i, left, true); for (const x of ex) if (!(x in src)) src[x] = id; return ex; });
      const p = pick(c, left, m.rules, i); if (p != null) { left[p]--; m.slots[i] = { id: p, rank: k + 1, note: D.NOTE[src[p]] }; }
    }
  }
  // pass 3: any owned item that fits the slot type
  for (const m of all) for (let i = 0; i < 5; i++) {
    if (m.slots[i] || m.ship.lo) continue;
    const types = slotTypes(m.ship, i); if (!types.length) continue;
    const c = Object.keys(left).map(Number).filter(id => left[id] > 0 && types.includes(etype(id)));
    const p = pick(c, left, m.rules, i); if (p != null) { left[p]--; m.slots[i] = { id: p, rank: 0 }; }
  }
  // nation rule check
  for (const m of all) for (const r of m.rules) {
    const n = r.slots.filter(i => m.slots[i] && r.nats.includes(enat(m.slots[i].id))).length;
    if (n === 0 && r.value >= 2) m.warn.push(r.slots.map(i => i + 1).join('·') + '번 칸에 ' + r.nats.map(x => NATKR[x] || x).join('/') + ' 장비가 없어서 스킬 조건을 못 채워요' + (r.prefix.includes('friend') ? ' (같은 진영 아군이 있으면 괜찮아요)' : ''));
  }
  return { out, left, wanted };
}
function tally(w, id) { if (id == null) return; w[id] = (w[id] || 0) + 1; }

  document.getElementById('invCount').textContent = '보유 ' + Object.keys(state.counts).length + '종 · ' + total + '개';
  const shown = ids.slice(0, 240);
  list.innerHTML = shown.length ? shown.map(id => { const n = state.counts[id] || 0; return '<div class="item ra' + erar(id) + (n ? '' : ' zero') + '">' + eico(id, 36) + '<div class="nm">' + esc(ename(id)) + '<small>' + '★'.repeat(Math.max(1, erar(id))) + ' · ' + esc(TYPE[etype(id)] || '') + ' · ' + esc(NATKR[enat(id)] || enat(id) || '공용') + '</small></div><button class="btn icon" data-id="' + id + '" data-d="-1" aria-label="하나 빼기">−</button><input type="number" min="0" max="999" id="cnt-' + id + '" data-id="' + id + '" value="' + n + '" aria-label="' + esc(ename(id)) + ' 개수"><button class="btn icon" data-id="' + id + '" data-d="1" aria-label="하나 더하기">+</button></div>'; }).join('') + (ids.length > shown.length ? '<div class="small muted">' + (ids.length - shown.length) + '개 더 있음 · 검색으로 좁혀 주세요</div>' : '') : '<div class="empty-state">' + (invOwned ? '아직 등록한 장비가 없어요. 위에서 캡처를 올리거나, 이름으로 검색해 개수를 넣어 주세요.' : '찾는 장비가 없어요.') + '</div>';
}

// ---------- capture (Claude reads screenshots) ----------
async function setupCapture() {
  const box = document.getElementById('capBox');
  const sample = window.claude ? await window.claude.use('sample') : null;
  const lim = sample ? await sample.limits().catch(() => null) : null;
  if (!sample || !lim || !lim.images || !lim.tools) { document.getElementById('capLabel').hidden = true; document.getElementById('capOut').innerHTML = '<p class="small muted">이 화면에서는 캡처 읽기를 쓸 수 없어요. 개수는 아래에서 직접 넣어 주세요.</p>'; return; }
  const file = document.getElementById('capFile');
  file.addEventListener('change', async () => {
    const files = [...file.files].slice(0, Math.max(1, lim.images.maxCount)); file.value = '';
    if (!files.length) return;
    const out = document.getElementById('capOut');
    const ctl = new AbortController();
    out.innerHTML = '<div class="row" style="margin-top:10px"><span class="status grow" id="capStatus">Claude가 캡처 ' + files.length + '장을 읽는 중이에요. 1~2분 걸릴 수 있어요.</span><button class="btn" id="capStop">멈추기</button></div>';
    document.getElementById('capStop').onclick = () => ctl.abort();
    const st = document.getElementById('capStatus');
    const tool = { name: 'search_equip', description: '벽람항로 장비 사전에서 이름 일부로 장비를 찾는다. 결과는 최대 10개의 {id, name, stars, type}. 타일의 잘린 이름 앞부분과 별 개수로 찾으면 된다.', inputSchema: { type: 'object', properties: { query: { type: 'string', description: '이름 일부 (예: "시제형 380", "STAAG", "유압식 캐")' }, stars: { type: 'integer', description: '타일의 별 개수 1~6. 모르면 생략' } }, required: ['query'] },
      execute: (inp) => { const q = String(inp.query || '').toLowerCase().replace(/\s+|\.+$/g, ''); const stars = Number(inp.stars) || 0; st.textContent = '찾는 중: ' + inp.query; const hits = ALL_EQ.filter(id => ename(id).toLowerCase().replace(/\s+/g, '').includes(q) && (!stars || erar(id) === stars)).slice(0, 10); return hits.map(id => ({ id, name: ename(id), stars: erar(id), type: TYPE[etype(id)] || '' })); } };
    const prompt = '첨부 이미지는 모바일 게임 벽람항로(아주르 레인) 한국 서버의 장비 창고 캡처다. 각 타일에는 장비 그림, 왼쪽 아래 별(등급, 1~6개), 강화 수치(+N), 오른쪽 아래 숫자(그 타일의 개수), 아래쪽에 잘린 이름이 있다.\n'
      + '할 일: 이미지에 보이는 모든 타일을 읽고, 타일마다 search_equip 도구로 장비 id를 찾는다. 잘린 이름은 보이는 앞부분으로 검색하고, 별 개수로 좁힌다. 그림과 종류(함포, 어뢰, 대공포, 함재기, 설비)도 맞는지 본다.\n'
      + '같은 장비가 여러 타일(강화 수치가 다른 경우)로 나뉘어 있으면 개수를 더한다. 화면 위쪽 메뉴에 가려 반쯤 보이는 타일도 읽되, 확실하지 않으면 confidence를 "low"로 한다. 맞는 id를 못 찾으면 id를 null로 둔다.\n'
      + '마지막 답은 JSON 배열 하나만: [{"id": 26600, "seen": "연장 보포스..", "stars": 5, "count": 3, "confidence": "high"}]';
    try {
      const res = await sample.json(prompt, { images: files, tools: [tool], signal: ctl.signal });
      if (!Array.isArray(res)) throw { code: 'invalid_json' };
      const merged = {}; const unknown = [];
      for (const r of res) { const id = Number(r.id); if (!id || !E[id]) { unknown.push(r); continue; } if (!merged[id]) merged[id] = { id, count: 0, low: false, seen: [] }; merged[id].count += Math.max(0, Number(r.count) || 0); merged[id].low = merged[id].low || r.confidence === 'low'; if (r.seen) merged[id].seen.push(String(r.seen)); }
      showCapture(Object.values(merged), unknown);
    } catch (e) {
      const msg = { cancelled: '읽기를 멈췄어요.', not_granted: 'Claude 사용을 허용하지 않아서 캡처를 읽을 수 없어요.', rate_limited: '사용량 한도에 걸렸어요. 잠시 후 다시 올려 주세요.', image_rejected: '이미지를 읽을 수 없어요. PNG나 JPG 캡처로 올려 주세요.', invalid_json: '결과 형식이 맞지 않았어요. 캡처를 1~2장씩 나눠서 다시 올려 주세요.', refused: 'Claude가 이 이미지를 처리하지 않았어요.' }[e && e.code] || '읽는 중 문제가 생겼어요. 다시 올려 주세요.';
      out.innerHTML = '<p class="status">' + esc(msg) + '</p>';
    }
  });
}
function showCapture(rows, unknown) {
  const out = document.getElementById('capOut');
  rows.sort((a, b) => erar(b.id) - erar(a.id));
  let h = '<div class="tablewrap" style="margin-top:10px"><table><thead><tr><th>반영</th><th>장비</th><th>캡처 개수</th><th>지금 개수</th><th>메모</th></tr></thead><tbody>';
  rows.forEach((r, i) => { h += '<tr><td><input type="checkbox" id="cap-' + i + '" ' + (r.low ? '' : 'checked') + ' aria-label="반영"></td><td>' + eico(r.id, 24) + ' ' + esc(ename(r.id)) + ' <span class="muted small">' + '★'.repeat(erar(r.id)) + '</span></td><td><input type="number" min="0" id="capn-' + i + '" value="' + r.count + '" style="width:60px"></td><td class="num">' + (state.counts[r.id] || 0) + '</td><td class="small muted">' + (r.low ? '확실하지 않음 · ' : '') + esc(r.seen.slice(0, 2).join(', ')) + '</td></tr>'; });
  h += '</tbody></table></div>';
  if (unknown.length) h += '<p class="small muted">못 찾은 타일 ' + unknown.length + '개: ' + esc(unknown.map(u => u.seen || '?').slice(0, 8).join(', ')) + '</p>';
  h += '<div class="row" style="margin-top:10px"><label class="row small"><input type="radio" name="capMode" id="capReplace" value="set" checked> 캡처 개수로 바꾸기</label><label class="row small"><input type="radio" name="capMode" id="capAdd" value="add"> 지금 개수에 더하기</label><button class="btn primary" id="capApply">체크한 ' + rows.length + '종 반영</button><button class="btn" id="capCancel">취소</button></div>';
  out.innerHTML = h;
  document.getElementById('capCancel').onclick = () => { out.innerHTML = ''; };
  document.getElementById('capApply').onclick = () => {
    const add = document.getElementById('capAdd').checked; let n = 0;
    rows.forEach((r, i) => { if (!document.getElementById('cap-' + i).checked) return; const c = Math.max(0, parseInt(document.getElementById('capn-' + i).value, 10) || 0); setCount(r.id, add ? (state.counts[r.id] || 0) + c : c); n++; });
    out.innerHTML = '<p class="status">' + n + '종을 창고에 반영했어요.</p>'; drawInv();
  };
}

// ---------- views ----------
let view = 'result';
function show(v) {
  view = v;
  for (const b of document.querySelectorAll('nav.tabs button')) b.setAttribute('aria-selected', String(b.dataset.view === v));
  for (const k of ['result', 'fleets', 'inv']) document.getElementById('view-' + k).hidden = k !== v;
  if (v === 'result') renderResult(); if (v === 'fleets') renderFleets(); if (v === 'inv') renderInv();
  try { localStorage.setItem('al-view', v); } catch (e) {}
}
document.querySelector('nav.tabs').addEventListener('click', e => { const b = e.target.closest('button[data-view]'); if (b) show(b.dataset.view); });

// ---------- persistence ----------
function changed(which) {
  if (view === 'result') renderResult();
  if (!dbRef) { try { localStorage.setItem('al-' + which, JSON.stringify(which === 'inv' ? state.counts : state.fleets)); } catch (e) {} setSave('warn', '이 브라우저에만 저장'); return; }
  clearTimeout(saveTimers[which]); setSave('warn', '저장 대기');
  saveTimers[which] = setTimeout(() => flush(which), 900);
}
async function flush(which) {
  if (saving[which]) { saveTimers[which] = setTimeout(() => flush(which), 500); return; }
  saving[which] = true; setSave('warn', '저장 중');
  try {
    if (which === 'inv') await dbRef.doc('state/inventory').set({ counts: state.counts, updatedAt: new Date().toISOString() });
    else await dbRef.doc('state/fleets').set({ fleets: state.fleets, updatedAt: new Date().toISOString() });
    setSave('ok', '저장됨');
  } catch (e) { setSave('err', e && e.code === 'invalid_argument' ? '저장 권한이 없어요' : '저장 실패 · 다시 바꾸면 재시도'); }
  saving[which] = false;
}
function localFallback() {
  try { const a = JSON.parse(localStorage.getItem('al-inv') || 'null'); if (a) state.counts = a; } catch (e) {}
  try { const b = JSON.parse(localStorage.getItem('al-fleets') || 'null'); if (b) state.fleets = b; } catch (e) {}
  loaded.inv = loaded.fleets = true; setSave('warn', '이 브라우저에만 저장');
  show(view);
}
async function boot() {
  try { const v = localStorage.getItem('al-view'); if (v && ['result', 'fleets', 'inv'].includes(v)) view = v; } catch (e) {}
  show(view);
  const db = window.claude ? await window.claude.use('db') : null;
  if (!db) { localFallback(); return; }
  dbRef = db;
  const timer = setTimeout(() => { if (!loaded.inv || !loaded.fleets) { setSave('err', '저장소 응답이 늦어요'); loaded.inv = loaded.fleets = true; show(view); } }, 10000);
  const done = () => { if (loaded.inv && loaded.fleets) { clearTimeout(timer); setSave('ok', '저장됨'); } };
  db.doc('state/inventory').onSnapshot(snap => {
    if (snap.metadata.hasPendingWrites) return;
    const d = snap.exists ? snap.data() : null; state.counts = d && d.counts ? { ...d.counts } : {};
    for (const k of Object.keys(state.counts)) if (!(state.counts[k] > 0)) delete state.counts[k];
    if (!snap.metadata.fromCache) loaded.inv = true; done(); if (view === 'inv') drawInv(); else if (view === 'result') renderResult();
  }, () => { loaded.inv = true; setSave('err', '창고를 못 불러왔어요'); show(view); });
  db.doc('state/fleets').onSnapshot(snap => {
    if (snap.metadata.hasPendingWrites) return;
    const d = snap.exists ? snap.data() : null; state.fleets = d && Array.isArray(d.fleets) ? JSON.parse(JSON.stringify(d.fleets)) : [];
    if (!snap.metadata.fromCache) loaded.fleets = true; done(); if (view === 'fleets') { if (!document.activeElement || !document.activeElement.closest('#view-fleets')) renderFleets(); } else if (view === 'result') renderResult();
  }, () => { loaded.fleets = true; setSave('err', '함대를 못 불러왔어요'); show(view); });
}
boot();
})();
</script>
